<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Cadenza mark">
  <defs>
    <style>
      :root { --ink:#0b1220; --gold:#c8a34a; }
      .inkStroke { stroke: var(--ink); }
      .goldStroke { stroke: var(--gold); }
      .goldFill { fill: var(--gold); }
      .inkFill { fill: var(--ink); }
    </style>
  </defs>

  <!-- Outer ring -->
  <circle cx="128" cy="128" r="104" fill="none" stroke="var(--ink)" stroke-width="10"/>

  <!-- Staff lines -->
  <g stroke="var(--ink)" stroke-width="6" stroke-linecap="round" opacity="0.92">
    <line x1="60" y1="96"  x2="196" y2="96"/>
    <line x1="60" y1="112" x2="196" y2="112"/>
    <line x1="60" y1="128" x2="196" y2="128"/>
    <line x1="60" y1="144" x2="196" y2="144"/>
    <line x1="60" y1="160" x2="196" y2="160"/>
  </g>

  <!-- Serif C monogram (subtle) -->
  <text x="128" y="154"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="76"
        fill="var(--ink)"
        opacity="0.40"
        letter-spacing="1">C</text>

  <!-- Baton -->
  <line x1="88" y1="176" x2="178" y2="78"
        stroke="var(--gold)" stroke-width="10" stroke-linecap="round"/>
  <circle cx="84" cy="180" r="10" fill="var(--gold)"/>

  <!-- Event dot -->
  <circle cx="170" cy="150" r="7" fill="var(--ink)"/>
</svg>
